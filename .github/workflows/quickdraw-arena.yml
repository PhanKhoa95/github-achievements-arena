name: "⚡ Quickdraw Instant Issue Bot"

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  quickdraw-close:
    runs-on: ubuntu-latest
    if: contains( lower(github.event.issue.title), 'quickdraw' )
    steps:
      - name: Auto-Close Quickdraw Issue Under 5 Minutes
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue.number;
            const author = context.payload.issue.user.login;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `⚡ **Gitty up, @${author}!** Closing this \`[Quickdraw]\` issue within 15 seconds of opening so you unlock the **⚡ Quickdraw** achievement! Don't forget to **⭐ Star** [**${owner}/${repo}**](https://github.com/${owner}/${repo})!`,
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed',
            });
